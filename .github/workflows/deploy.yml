# The site itself is built and hosted at https://petarvelickovic.com/.
# This publishes only a redirect, so the old GitHub Pages address
# (https://zoxtedy.github.io/harmonika/) forwards visitors to the domain.
name: Redirect GitHub Pages to petarvelickovic.com

on:
  push:
    branches: [main]
    paths: [redirect/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
